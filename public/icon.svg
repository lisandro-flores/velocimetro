<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="arc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00e5ff"/>
      <stop offset="100%" style="stop-color:#ff6d00"/>
    </linearGradient>
  </defs>
  <!-- Fondo circular -->
  <circle cx="50" cy="50" r="48" fill="url(#bg)" stroke="#2a2a3d" stroke-width="1"/>
  <!-- Arco gauge -->
  <path d="M 20 70 A 35 35 0 1 1 80 70" fill="none" stroke="url(#arc)" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <!-- Aguja -->
  <line x1="50" y1="50" x2="68" y2="28" stroke="#ff6d00" stroke-width="3" stroke-linecap="round"/>
  <!-- Centro -->
  <circle cx="50" cy="50" r="4" fill="#00e5ff"/>
  <!-- Texto -->
  <text x="50" y="78" text-anchor="middle" fill="#00e5ff" font-family="sans-serif" font-size="10" font-weight="bold">MS</text>
</svg>
