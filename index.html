<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="description" content="MotoSpeed - Velocímetro PWA para motociclismo. Velocidad GPS, brújula digital, tracking de viajes y más." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />

    <title>MotoSpeed - Velocímetro Moto</title>

    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

    <!-- Google Fonts: Orbitron (números) + Inter (texto) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app">
      <!-- Alert overlay (parpadea en rojo al superar velocidad) -->
      <div id="alert-overlay" class="alert-overlay"></div>

      <!-- Contenido principal (vistas) -->
      <main id="app-content" class="app-content"></main>

      <!-- Navbar inferior -->
      <footer id="app-navbar" class="app-navbar"></footer>
    </div>

    <script type="module" src="/src/main.ts"></script>

</html>
