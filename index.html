<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="description" content="MotoSpeed - Velocímetro PWA para motociclismo. Velocidad GPS, brújula digital, tracking de viajes y más." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />

    <title>MotoSpeed - Velocímetro Moto</title>

    <!-- Open Graph / Link Previews -->
    <meta property="og:title" content="MotoSpeed - Velocímetro PWA" />
    <meta property="og:description" content="Velocímetro para motociclismo con GPS, brújula y registro de viajes." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://velocimetro.ngicode.com/" />
    <meta property="og:image" content="https://velocimetro.ngicode.com/icon-512.png" />
    
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

    <!-- Google Fonts: Orbitron (números) + Inter (texto) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app">
      <!-- Alert overlay (parpadea en rojo al superar velocidad) -->
      <div id="alert-overlay" class="alert-overlay"></div>

      <!-- Install Prompt Banner -->
      <div id="install-banner" class="install-banner" style="display: none;">
        <div class="install-info">
          <strong>MotoSpeed</strong>
          <span>Instala la app para mejor experiencia</span>
        </div>
        <div class="install-actions">
          <button id="install-btn" class="btn btn-primary">Instalar</button>
          <button id="install-close-btn" class="btn-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>
      </div>

      <!-- Contenido principal (vistas) -->
      <main id="app-content" class="app-content"></main>

      <!-- Navbar inferior -->
      <footer id="app-navbar" class="app-navbar"></footer>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
